version: '3.2'
services:
  mysql:
    image: "crpi-ihkn2rvtrqwwopyn.cn-hongkong.personal.cr.aliyuncs.com/my_island/mysql:5.7"
    container_name: mysql
    restart: always
    privileged: true
    environment:
      MYSQL_ROOT_PASSWORD: 123456  #主库root用户的密码
      TZ: Asia/Shanghai
      MYSQL_DATABASE: island
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --max_allowed_packet=128M;
    networks:
      island_network:
        ipv4_address: 10.2.0.2
  redis:
    image: "crpi-ihkn2rvtrqwwopyn.cn-hongkong.personal.cr.aliyuncs.com/my_island/redis:7.4"
    container_name: redis
    restart: always
    networks:
      island_network:
        ipv4_address: 10.2.0.3
  island:
    image: "crpi-ihkn2rvtrqwwopyn.cn-hongkong.personal.cr.aliyuncs.com/my_island/island:backend"
    container_name: island
    restart: always
    networks:
      island_network:
        ipv4_address: 10.2.0.4
    depends_on:
      - mysql
      - redis
    volumes:
      - ./uploads:/app/uploads
networks:  #定义容器连接网络
  island_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.2.0.0/24